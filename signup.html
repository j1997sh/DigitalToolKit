<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Campaign Platform</title><link rel="stylesheet" href="assets/css/style.css?v=20260826-stage4d-privacy-imprint"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-card signup-geo-card">
<div class="auth-brand"><span class="brand-mark">CP</span><div><strong>Campaign Platform</strong></div></div>
<div class="auth-heading"><h1>Create account</h1><p>Set up your local campaign workspace.</p></div>
<form id="stage2SignupForm" class="auth-form">
<div class="signup-name-grid"><label class="field"><span>First name</span><input id="signupFirstName" autocomplete="given-name" required></label><label class="field"><span>Last name</span><input id="signupLastName" autocomplete="family-name" required></label></div>
<label class="field"><span>Email address</span><input id="signupEmail" type="email" autocomplete="email" required></label>
<label class="field"><span>Password</span><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required></label>
<div class="signup-section-title"><strong>Your campaign geography</strong><span>This is the area your workspace represents.</span></div>
<label class="field"><span>Account type</span><select id="signupAccountType"><option value="councillor">Councillor / council candidate</option><option value="parliamentary">MP / parliamentary candidate</option><option value="mayoral">Mayoral campaign</option><option value="other">Other campaign</option></select></label>
<label class="field"><span>Campaign / contact address</span><input id="signupAddress1" autocomplete="address-line1" required></label>
<label class="field"><span>Address line 2</span><input id="signupAddress2" autocomplete="address-line2"></label>
<div class="signup-name-grid"><label class="field"><span>Town / city</span><input id="signupTown" autocomplete="address-level2" required></label><label class="field"><span>Postcode</span><input id="signupPostcode" autocomplete="postal-code" required></label></div>
<button class="btn secondary small geo-lookup-button" type="button" id="signupLookupPostcode">Look up political geography</button>
<div id="signupGeoStatus"></div>
<label class="field"><span>Parliamentary constituency</span><input id="signupConstituency" required></label>
<div class="signup-name-grid"><label class="field"><span>Ward</span><input id="signupWard"></label><label class="field"><span>Local authority</span><input id="signupAuthority"></label></div>
<button class="btn auth-submit" type="submit" id="signupSubmit">Create account</button>
</form><div id="signupMessage"></div><div class="auth-links"><span>Already have an account? <a href="login.html">Log in</a></span></div>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js?v=20260826-stage3d-geo"></script><script src="assets/js/signup-stage3d-geography.js?v=20260826-stage3d-geo"></script></body></html>
