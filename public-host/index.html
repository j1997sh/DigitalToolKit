<script>
(async()=>{
 const r=await window.cpSupabase.rpc('public_route_request',{p_hostname:location.hostname,p_path:location.pathname});
 if(r.error||!r.data||r.data.status!==200){publicHostRoot.innerHTML='<div><h1>Page not found</h1><p>This campaign page is not currently available.</p></div>';return}
 if(r.data.redirect_url){location.replace(r.data.redirect_url);return}
 window.CP_PUBLIC_ROUTE=r.data;
 const root=document.createElement('div');
 root.id=r.data.entity_type==='website'?'publicSiteRoot':'campaignSiteRoot';
 publicHostRoot.replaceWith(root);
 const s=document.createElement('script');s.src=r.data.entity_type==='website'?'/assets/js/public-site-supabase.js?v=20260826-stage5c-cloudflare':'/assets/js/campaign-site-stage2.js?v=20260826-stage5c-cloudflare';document.body.appendChild(s);
})();
